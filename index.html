<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17212b"><title>Guitar Academy</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Guitar Academy"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f5;background:#101820}*{box-sizing:border-box}body{margin:0}header{padding:20px max(18px,calc((100vw - 1000px)/2));background:#17212b;border-bottom:1px solid #33404a;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}h2{font-size:21px}h3{margin:10px 0}small,.muted{color:#a9b8c5}main{max-width:1000px;margin:auto;padding:18px;display:grid;grid-template-columns:240px 1fr;gap:20px}aside,section,.panel{background:#1a2631;border:1px solid #334350;border-radius:15px;padding:18px}aside{height:max-content}button,.btn{background:#e88419;color:white;border:0;border-radius:9px;padding:11px 13px;font-weight:650;cursor:pointer}button.secondary{background:#2c3e4d}button:disabled{opacity:.4;cursor:not-allowed}nav button{display:block;width:100%;text-align:left;margin:8px 0;background:#273746}nav button.active{background:#ad5b0b}article{line-height:1.6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#253644;padding:13px;border-radius:10px}.metric strong{font-size:24px;display:block}progress{width:100%;height:14px;accent-color:#59b68e}.lesson{border:1px solid #405364;border-radius:12px;padding:14px;margin:10px 0}.lesson.done{border-color:#438c70}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tag{font-size:12px;background:#314454;border-radius:50px;padding:5px 9px}ol li{margin-bottom:10px}textarea,input,select{background:#101a22;color:#fff;border:1px solid #566979;border-radius:8px;padding:10px;width:100%;font:inherit}label{display:block;margin:10px 0}.timer{font-variant-numeric:tabular-nums;font-size:42px;font-weight:750;text-align:center;margin:10px}pre{overflow:auto;background:#101820;padding:13px;border-radius:8px;line-height:1.3}.fret{overflow:auto}.fret table{border-collapse:collapse;min-width:550px;width:100%}.fret td,.fret th{text-align:center;border:1px solid #43515e;padding:9px 4px;font-  .metbeat{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:50%;background:#314454;margin:5px;border:1px solid #586675}.metbeat.hit{background:#f89a2c;color:#101820;box-shadow:0 0 12px #f89a2c}.metbeat.first{border-color:#f89a2c}.metcontrols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metbig{text-align:center;font-size:56px;font-weight:800}.question{padding:14px;border:1px solid #405364;border-radius:12px;margin:12px 0}.choice{display:block;margin:9px 0;padding:9px;background:#233442;border-radius:8px}.choice input{width:auto;margin-right:9px}.resultgood{color:#74d8a0}.resultbad{color:#ffb177}@media(max-width:620px){.metcontrols{grid-template-columns:1fr 1fr}} </style></head><body><header><div><h1><img src="apple-touch-icon.png" alt="" style="width:35px;height:35px;border-radius:9px;vertical-align:middle;margin-right:8px">Guitar Academy</h1><small>Persoonlijk gitaartraject · maand 1</small></div><span class="tag">Gratis · offline</span></header><main><aside><nav id="nav"></nav><hr style="border-color:#334350"><small>Voortgang wordt op dit apparaat bewaard. Exporteer geregeld een back-up om je gegevens over te zetten.</small></aside><div id="view"></div></main><script>
const weeks=[
{title:'Fretboard & intervallen',goal:'Vind C, F en G vlot en speel grondtoon, terts en kwint.',sessions:[

['Intervallen worden akkoorden',[['5 min','Chromatische alternate picking; houd je handen ontspannen.'],['10 min','Speel C–E–G en C–E♭–G; hoor majeur versus mineur.'],['10 min','Zoek A–C–E (Am) en F–A–C (F) op verschillende snaren.'],['5 min','Improviseer uitsluitend met de actuele akkoordnoten over C–Am–F–G.']]],
['Toepassen en techniek',[['5 min','Alternate picking 16den bij 60 BPM; verhoog alleen bij zuivere timing.'],['10 min','Benoem en speel 1–3–5 van C, F, G en 1–♭3–5 van Am.'],['10 min','Loop: land bij elke akkoordwissel op een akkoordnoot.'],['5 min','Neem een korte improvisatie op en luister naar je akkoordwisselingen.']]]],
quiz:[['Welke noten vormen C majeur?','C E G'],['Wat verandert van C majeur naar C mineur?','E wordt Es (kleine terts)'],['Welke noten vormen Am?','A C E']]},

['Van majeur naar mineur',[['5 min','Herhaal de drie C-voicings.'],['10 min','Verlaag in iedere C-vorm de terts E naar Es.'],['10 min','Zoek drie Am-voicings op G-B-e (bijv. 5-5-5, 9-10-8, 14-13-12).'],['5 min','Wissel tussen C en Am met kleine handbewegingen.']]],
['Voice leading',[['5 min','16den alternate picking, 60–70 BPM.'],['10 min','Zoek nabije drieklanken van C–Am–F–G op G-B-e.'],['10 min','Speel de progressie met gedempte funk-aanslagen en een drumloop.'],['5 min','Neem de begeleiding op; controleer vloeiende wisselingen.']]]],
quiz:[['Wat is de formule van een majeurdrieklank?','1 3 5'],['Wat is de formule van een mineurdrieklank?','1 b3 5'],['Wat betekent een omkering?','Een andere akkoordnoot ligt in de bas']]},
{title:'Majeurtoonladder',goal:'Breid A mineur pentatonisch uit met F en B; speel C majeur bewust.',sessions:[
['C majeur leren',[['5 min','Alternate picking warming-up.'],['10 min','Leer de majeurformule 1–2–3–4–5–6–7 en C D E F G A B.'],['10 min','Speel de C-majeurpositie (tab onderaan) en zeg noten hardop.'],['5 min','Improviseer over C–Am–F–G met C majeur.']]],
['Uit de pentatonische box',[['5 min','Speel A mineur pentatonisch in 5e positie.'],['10 min','Voeg F en B toe aan je vertrouwde pentatonische frases.'],['10 min','Wissel bewust vijf- en zevennotige frases over de loop.'],['5 min','Neem twee versies op en vergelijk.']]],
['Posities verbinden',[['5 min','Alternate picking, 70 BPM.'],['10 min','Speel C majeur in twee aangrenzende posities.'],['10 min','Improviseer langs de hals, niet alleen binnen één box.'],['5 min','Speel een melodie op gehoor na en benoem de noten.']]]],
quiz:[['Welke noten zitten in C majeur?','C D E F G A B'],['Welke twee noten voeg je toe aan A mineur pentatonisch voor A natuurlijk mineur?','F en B'],['Welke mineurtoonladder heeft dezelfde noten als C majeur?','A natuurlijk mineur']]},
{title:'Akkoordgericht improviseren',goal:'Laat solo’s de akkoordwisselingen volgen; combineer techniek en muzikaliteit.',sessions:[
['Target notes',[['5 min','Alternate picking warming-up.'],['10 min','Zoek de akkoordnoten van C–Am–F–G binnen je C-majeurpositie.'],['10 min','Start of eindig iedere maat op een akkoordnoot.'],['5 min','Luister terug: hoor je de harmonie in je solo?']]],
['Bends en snelheid',[['5 min','16den alternate picking bij gecontroleerd tempo.'],['10 min','Speel doelnoot, bend vanuit een lagere noot naar dezelfde toonhoogte; controleer met tuner.'],['10 min','Oefen vibrato, legato en korte snelle frases met metronoom.'],['5 min','Gebruik één technische frase muzikaal in een solo.']]],
['Maandopdracht',[['5 min','Warm-up en stem je gitaar.'],['10 min','Neem C–Am–F–G op met minstens twee voicings.'],['10 min','Neem een solo op met diatonische noten en duidelijke chord tones.'],['5 min','Luister terug, noteer één sterk punt en één verbeterpunt.']]]],
quiz:[['Welke noten vormen G majeur?','G B D'],['Welke noot is de grote terts van F?','A'],['Waarom mik je op akkoordnoten?','Ze laten de melodie de harmonie volgen']]}];
const tab=`C majeur — positie rond fret 7–10\ne|-----------------------7-8-|\nB|-------------------8-10----|\nG|--------------7-9-10-------|\nD|---------7-9-10------------|\nA|----7-8-10-----------------|\nE|-8-10----------------------|`;
const key='guitar-academy-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch(e){state={}};state.done||={};state.notes||={};state.quiz||={};state.bpm||={};state.minutes||=0;state.weekReviews||={};state.aiFeedback||={};let page='home',currentWeek=0,currentSession=0,timer=1800,interval=null;
function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function count(){return Object.values(state.done).filter(Boolean).length}function nav(){document.getElementById('nav').innerHTML=[['home','Dashboard'],['lessons','Lessen'],['fretboard','Gitaarhals'],['review','Evaluaties'],['metronome','Metronoom'],['backup','Back-up']].map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}function go(p){if(page==='metronome'&&p!=='metronome')stopMetro();page=p;render()}function render(){nav();let v=document.getElementById('view');if(page==='home')v.innerHTML=home();if(page==='lessons')v.innerHTML=lessons();if(page==='lesson')v.innerHTML=lesson();if(page==='fretboard')v.innerHTML=fretboard();if(page==='review')v.innerHTML=review();if(page==='backup')v.innerHTML=backup();if(page==='metronome'){v.innerHTML=metronome();updateBeatDisplay()}}
function home(){let next=Array.from({length:12},(_,i)=>i).find(i=>!state.done[i])??11;return `<section><h2>Welkom terug 👋</h2><p class="muted">Jouw 4-wekenprogramma, met 3 lessen van 30 minuten per week.</p><div class="cards"><div class="metric"><strong>${count()}/12</strong><small>Lessen</small></div><div class="metric"><strong>${state.minutes}</strong><small>Minuten</small></div><div class="metric"><strong>${Object.keys(state.weekReviews).length}/4</strong><small>Evaluaties</small></div></div><p><progress value="${count()}" max="12"></progress></p><div class="panel"><small>VOLGENDE LES · WEEK ${Math.floor(next/3)+1}</small><h3>${esc(weeks[Math.floor(next/3)].sessions[next%3][0])}</h3><p>${esc(weeks[Math.floor(next/3)].goal)}</p><button onclick="openLesson(${Math.floor(next/3)},${next%3})">Open les</button></div><button onclick="go('metronome')">♩ Open metronoom</button><h3>Vier weken</h3>${weeks.map((w,i)=>`<div class="lesson"><div class="row"><strong>Week ${i+1}: ${esc(w.title)}</strong><span class="tag">${[0,1,2].filter(j=>state.done[i*3+j]).length}/3</span></div><p class="muted">${esc(w.goal)}</p><button class="secondary" onclick="currentWeek=${i};go('lessons')">Bekijk lessen</button></div>`).join('')}</section>`}
function lessons(){return `<section><h2>Alle lessen</h2><div class="row">${weeks.map((w,i)=>`<button class="${i===currentWeek?'':'secondary'}" onclick="currentWeek=${i};render()">Week ${i+1}</button>`).join('')}</div><h3>${esc(weeks[currentWeek].title)}</h3><p>${esc(weeks[currentWeek].goal)}</p>${weeks[currentWeek].sessions.map((s,i)=>`<div class="lesson ${state.done[currentWeek*3+i]?'done':''}"><div class="row"><div><strong>Les ${currentWeek*3+i+1}: ${esc(s[0])}</strong><div class="muted">30 minuten</div></div><span>${state.done[currentWeek*3+i]?'✓ Voltooid':'Open'}</span></div><p><button onclick="openLesson(${currentWeek},${i})">${state.done[currentWeek*3+i]?'Opnieuw bekijken':'Start les'}</button></p></div>`).join('')}<button class="secondary" onclick="go('review')">Weekevaluatie</button></section>`}
function openLesson(w,s){currentWeek=w;currentSession=s;timer=1800;stopTimer();page='lesson';render()}
function lesson(){let w=weeks[currentWeek],s=w.sessions[currentSession],id=currentWeek*3+currentSession;return `<section><button class="secondary" onclick="go('lessons')">← Terug</button><p class="muted">WEEK ${currentWeek+1} · LES ${id+1}</p><h2>${esc(s[0])}</h2><div class="timer" id="clock">30:00</div><div class="row"><button onclick="startTimer()">▶ Start / hervat</button><button class="secondary" onclick="stopTimer()">Pauze</button><button class="secondary" onclick="resetTimer()">Reset</button></div><p><button class="secondary" onclick="go('metronome')">♩ Open metronoom</button></p><h3>Oefenplan</h3><ol>${s[1].map(x=>`<li><strong>${esc(x[0])}:</strong> ${esc(x[1])}</li>`).join('')}</ol><div class="notice">Loop: C – Am – F – G, één akkoord per maat op 70 BPM. Speel schoon en gecontroleerd; verhoog tempo alleen bij goede timing.</div>${currentWeek===1?'<h3>C-majeurdrieklanken op G–B–e</h3><pre>e|--3--|--8--|--12--|\nB|--5--|--8--|--13--|\nG|--5--|--9--|--12--|</pre>':''}${currentWeek===2?`<h3>C-majeurtoonladder</h3><pre>${tab}</pre>`:''}<h3>Jouw notities</h3><textarea id="notes" rows="4" placeholder="Wat ging goed? Waar liep je vast?">${esc(state.notes[id]||'')}</textarea><div class="row"><button class="secondary" onclick="state.notes[${id}]=document.getElementById('notes').value;save();alert('Notities opgeslagen')">Bewaar notities</button><button onclick="finishLesson(${id})">${state.done[id]?'✓ Al voltooid':'Markeer als voltooid'}</button></div></section>`}
function finishLesson(id){state.notes[id]=document.getElementById('notes').value;if(!state.done[id]){state.done[id]=true;state.minutes+=30}save();go('lessons')}
function startTimer(){if(interval)return;interval=setInterval(()=>{timer=Math.max(0,timer-1);let el=document.getElementById('clock');if(el)el.textContent=`${String(Math.floor(timer/60)).padStart(2,'0')}:${String(timer%60).padStart(2,'0')}`;if(timer===0){stopTimer();alert('30 minuten voorbij!')}},1000)}function stopTimer(){if(interval){clearInterval(interval);interval=null}}function resetTimer(){stopTimer();timer=1800;let el=document.getElementById('clock');if(el)el.textContent='30:00'}
const strings=[['e',4],['B',11],['G',7],['D',2],['A',9],['E',4]],names=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];let root=0,mode='major';function fretboard(){let pcs=mode==='major'?[0,2,4,5,7,9,11]:mode==='minor'?[0,2,3,5,7,8,10]:mode==='pent'?[0,3,5,7,10]:[0,4,7];let table='<table><tr><th>Snaar</th>'+Array.from({length:13},(_,i)=>`<th>${i}</th>`).join('')+'</tr>';for(let [label,pc] of strings){table+=`<tr><th>${label}</th>`+Array.from({length:13},(_,f)=>{let note=(pc+f)%12,delta=(note-root+12)%12;return `<td class="${pcs.includes(delta)?'on':''}">${pcs.includes(delta)?names[note]:'·'}</td>`}).join('')+'</tr>'}return `<section><h2>Interactieve gitaarhals</h2><p>Bekijk de noten van een toonladder of majeurdrieklank over fret 0–12.</p><div class="row"><label>Grondtoon<select onchange="root=Number(this.value);render()">${names.map((n,i)=>`<option value="${i}" ${i===root?'selected':''}>${n}</option>`).join('')}</select></label><label>Weergave<select onchange="mode=this.value;render()"><option value="major" ${mode==='major'?'selected':''}>Majeur</option><option value="minor" ${mode==='minor'?'selected':''}>Natuurlijk mineur</option><option value="pent" ${mode==='pent'?'selected':''}>Mineur pentatonisch</option><option value="triad" ${mode==='triad'?'selected':''}>Majeurdrieklank</option></select></label></div><div class="fret">${table+'</table>'}</div><p class="muted">Blauwe vakken zijn toonladder- of akkoordnoten. De hoge e-snaar staat bovenaan.</p></section>`}
const tests=[
[{q:'Welke noten vormen C majeur?',a:['C – E – G','C – E♭ – G','C – F – G'],correct:0,why:'Een majeurdrieklank bestaat uit grondtoon, grote terts en reine kwint.'},{q:'Welke noot verandert als C majeur C mineur wordt?',a:['C wordt B','E wordt E♭','G wordt F'],correct:1,why:'De grote terts E daalt één halve toon naar E♭.'},{q:'Wat is de reine kwint boven F?',a:['A','B♭','C'],correct:2,why:'F naar C is zeven halve tonen.'}],
[{q:'Welke formule hoort bij een mineurdrieklank?',a:['1–3–5','1–♭3–5','1–4–5'],correct:1,why:'Mineur heeft een kleine terts.'},{q:'Wat is de eerste omkering van C majeur (laag naar hoog)?',a:['E–G–C','G–C–E','C–E–G'],correct:0,why:'In de eerste omkering ligt de terts onderaan.'},{q:'Wat zijn de noten van A mineur?',a:['A–C♯–E','A–D–E','A–C–E'],correct:2,why:'A mineur bestaat uit A, C en E.'}],
[{q:'Welke noten horen bij C majeur?',a:['C D E F G A B','C D E♭ F G A B♭','C D E F♯ G A B'],correct:0,why:'C majeur heeft geen kruisen of mollen.'},{q:'Welke twee noten ontbreken in A mineur pentatonisch vergeleken met A natuurlijk mineur?',a:['C en G','F en B','D en E'],correct:1,why:'A mineur pentatonisch is A C D E G; natuurlijk mineur voegt B en F toe.'},{q:'Welke is de relatieve mineur van C majeur?',a:['C mineur','E mineur','A mineur'],correct:2,why:'A natuurlijk mineur gebruikt dezelfde noten als C majeur.'}],
[{q:'Welke noten vormen G majeur?',a:['G–B–D','G–B♭–D','G–C–D'],correct:0,why:'G majeur is grondtoon G, grote terts B, kwint D.'},{q:'Welke noot is de grote terts van F?',a:['A♭','A','B'],correct:1,why:'F naar A is vier halve tonen.'},{q:'Welke noten zijn stabiele doelnoten over Am?',a:['A–C♯–E','A–B–D','A–C–E'],correct:2,why:'De akkoordnoten van Am zijn A, C en E.'}]];
function review(){return `<section><h2>Wekelijkse evaluaties</h2><p>Drie automatisch nagekeken theorievragen en een praktische zelfevaluatie. De app geeft gerichte vervolgstappen, zonder betaalde AI.</p>${weeks.map((w,i)=>`<div class="lesson"><div class="row"><strong>Week ${i+1}: ${esc(w.title)}</strong><span class="tag">${state.weekReviews[i]?.autoScore!==undefined?state.weekReviews[i].autoScore+'/3 theorie':state.weekReviews[i]?'Oude evaluatie':'Nog niet beoordeeld'}</span></div><div class="row"><button onclick="openReview(${i})">${state.weekReviews[i]?'Opnieuw evalueren':'Start evaluatie'}</button>${state.weekReviews[i]?`<button class="secondary" onclick="renderResult(${i})">Bekijk resultaat</button>`:''}</div></div>`).join('')}</section>`}
function openReview(i){currentWeek=i;page='reviewForm';nav();let old=state.weekReviews[i]||{};document.getElementById('view').innerHTML=`<section><button class="secondary" onclick="go('review')">← Terug</button><h2>Evaluatie week ${i+1}</h2><p>Beantwoord alle vragen zonder hulpmiddelen. Beoordeel daarna je uitvoering.</p>${tests[i].map((t,j)=>`<div class="question"><strong>${j+1}. ${esc(t.q)}</strong>${t.a.map((a,k)=>`<label class="choice"><input type="radio" name="q${j}" value="${k}" required> ${esc(a)}</label>`).join('')}</div>`).join('')}<label>Praktische beheersing (0–5)<select id="practical">${Array.from({length:6},(_,j)=>`<option value="${j}" ${j===(old.practical??3)?'selected':''}>${j}/5</option>`).join('')}</select></label><label>Wat ging moeilijk?<textarea id="difficulty" rows="3">${esc(old.difficulty||'')}</textarea></label><label>Comfortabel 16de-notentempo (BPM)<input id="bpm" type="number" min="30" max="240" value="${old.bpm||70}"></label><button onclick="submitReview(${i})">Controleer en bewaar evaluatie</button></section>`}
function submitReview(i){let answers=tests[i].map((_,j)=>{let el=document.querySelector(`input[name="q${j}"]:checked`);return el?Number(el.value):null});if(answers.some(x=>x===null)){alert('Beantwoord eerst alle drie de theorievragen.');return}let practical=Number(document.getElementById('practical').value),difficulty=document.getElementById('difficulty').value,bpm=Math.max(30,Math.min(240,Number(document.getElementById('bpm').value)||70)),autoScore=answers.filter((a,j)=>a===tests[i][j].correct).length;state.weekReviews[i]={answers,practical,difficulty,bpm,autoScore,date:new Date().toISOString()};state.bpm[i]=bpm;save();page='reviewResult';renderResult(i)}
function renderResult(i){nav();let r=state.weekReviews[i],w=weeks[i],modern=r.autoScore!==undefined,good=modern&&r.autoScore===3&&r.practical>=4;document.getElementById('view').innerHTML=`<section><button class="secondary" onclick="go('review')">← Terug</button><h2>Resultaat week ${i+1}</h2>${modern?`<div class="panel"><strong>Theorie ${r.autoScore}/3 · Praktijk ${r.practical}/5</strong><p class="${good?'resultgood':'resultbad'}">${good?'Klaar om door te gaan!':'Gerichte herhaling aanbevolen'}</p></div>${tests[i].map((t,j)=>`<div class="lesson"><strong>${esc(t.q)}</strong><p class="${r.answers[j]===t.correct?'resultgood':'resultbad'}">Jouw antwoord: ${esc(t.a[r.answers[j]])} ${r.answers[j]===t.correct?'✓':'✗'}</p><p>Correct: <strong>${esc(t.a[t.correct])}</strong></p><small>${esc(t.why)}</small></div>`).join('')}`:`<p>Deze evaluatie is gemaakt in de vorige versie. Je kunt opnieuw evalueren met automatische correctie.</p>`}<div class="notice"><strong>Advies:</strong> ${good?'Ga door met de volgende week. Herhaal de voicings nog kort als warming-up.':r.practical<4?'Herhaal de lastigste praktische sessie en maak een nieuwe opname. Focus op ontspannen, zuiver en in de maat spelen.':'Herhaal de fout beantwoorde theorievragen en zoek de bijbehorende noten op de gitaarhals.'}</div><p><strong>Tempo:</strong> ${esc(r.bpm)} BPM</p><p><strong>Jouw moeilijkheden:</strong> ${esc(r.difficulty||'Geen ingevuld')}</p><div class="row"><button onclick="shareReview(${i})">↗ Bespreek met ChatGPT</button><button class="secondary" onclick="copyReview(${i})">Kopieer evaluatie</button><button class="secondary" onclick="showFeedbackImport(${i})">↓ Importeer feedback</button>${feedbackSummary(i)}<button class="secondary" onclick="openReview(${i})">Opnieuw proberen</button></div></section>`}
function reviewText(i){
 let r=state.weekReviews[i];if(!r)return '';
 let details=(r.autoScore!==undefined?tests[i].map((t,j)=>`- ${t.q}\n  Mijn antwoord: ${t.a[r.answers[j]]} (${r.answers[j]===t.correct?'juist':'fout'}); correct: ${t.a[t.correct]}`).join('\n'):'Oude evaluatie zonder meerkeuze-antwoorden');
 let lessons=weeks[i].sessions.map((s,j)=>`${i*3+j+1}. ${s[0]}: ${state.done[i*3+j]?'afgerond':'nog niet afgerond'}; notities: ${state.notes[i*3+j]||'geen'}`).join('\n');
 return `GUITAR ACADEMY — EVALUATIE WEEK ${i+1}\nOnderwerp: ${weeks[i].title}\nTheorie: ${r.autoScore??'niet beoordeeld'}/3; praktische zelfscore: ${r.practical}/5; comfortabel tempo 16den: ${r.bpm} BPM.\nMoeilijkheden: ${r.difficulty||'geen opgegeven'}\nAntwoorden:\n${details}\nLessen:\n${lessons}\n\nIk speel ruim 10 jaar gitaar en wil beter worden in theorie, akkoordvoicings, melodische improvisatie en technische snelheid. Ik oefen 2–3 x 30 minuten per week. Analyseer mijn resultaten en geef concrete aanpassingen. Antwoord ook met een JSON-feedbackblok tussen de markers GUITAR_ACADEMY_FEEDBACK_START en GUITAR_ACADEMY_FEEDBACK_END, met precies deze structuur: {"schema":"guitar-academy-feedback-v1","week":${i+1},"summary":"korte feedback","focus":"belangrijkste aandachtspunt","exercises":[{"title":"oefening","minutes":10,"instructions":"uitvoerbare instructie"}],"nextStep":"wat nu?"}. Gebruik maximaal 4 oefeningen, elk 5–30 minuten. Geen Markdown-codehekken binnen de markers.`;
}
async function shareReview(i){
 let message=reviewText(i);
 try{await navigator.clipboard.writeText(message);alert('Evaluatie gekopieerd. ChatGPT wordt geopend. Open daar DEZE bestaande conversatie en plak je evaluatie in het berichtveld.');window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}
 catch(e){prompt('Kopieer deze evaluatie en plak ze in onze bestaande ChatGPT-chat:',message);window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}
}
function feedbackSummary(i){let f=state.aiFeedback?.[i];if(!f)return '';return `<div class="panel"><h3>Feedback van ChatGPT</h3><p>${esc(f.summary)}</p><p><strong>Focus:</strong> ${esc(f.focus)}</p><ol>${f.exercises.map(x=>`<li><strong>${esc(x.title)} (${x.minutes} min):</strong> ${esc(x.instructions)}</li>`).join('')}</ol><p><strong>Volgende stap:</strong> ${esc(f.nextStep)}</p><button class="secondary" onclick="showFeedbackImport(${i})">Feedback vervangen</button></div>`}
function showFeedbackImport(i){
 page='feedbackImport';nav();document.getElementById('view').innerHTML=`<section><button class="secondary" onclick="renderResult(${i})">← Terug naar evaluatie</button><h2>Importeer ChatGPT-feedback</h2><p>Plak het JSON-feedbackblok dat ChatGPT je gaf. Je kunt de markers meeplakken. De app controleert de inhoud en bewaart het advies bij week ${i+1}. Bestaande lessen blijven intact.</p><label>Feedback<textarea id="feedbackPaste" rows="12" placeholder='GUITAR_ACADEMY_FEEDBACK_START\n{"schema":"guitar-academy-feedback-v1",...}\nGUITAR_ACADEMY_FEEDBACK_END'></textarea></label><button onclick="importFeedback(${i})">Controleer en bewaar feedback</button><p class="muted">Dit is geen live AI-verbinding. Kopiëren en plakken blijft nodig; er zijn geen API-kosten.</p></section>`;
}
function importFeedback(i){
 try{
 let raw=document.getElementById('feedbackPaste').value.trim();let start='GUITAR_ACADEMY_FEEDBACK_START',end='GUITAR_ACADEMY_FEEDBACK_END';if(raw.includes(start)){raw=raw.split(start)[1].split(end)[0].trim()}
 raw=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();let f=JSON.parse(raw);
 if(f.schema!=='guitar-academy-feedback-v1'||f.week!==i+1)throw Error('Dit feedbackblok hoort niet bij deze week of heeft een onbekend formaat.');
 for(let k of ['summary','focus','nextStep'])if(typeof f[k]!=='string'||!f[k].trim()||f[k].length>1500)throw Error('Ongeldig veld: '+k);
 if(!Array.isArray(f.exercises)||f.exercises.length<1||f.exercises.length>4)throw Error('Verwacht 1 tot 4 oefeningen.');
 for(let e of f.exercises)if(typeof e.title!=='string'||!e.title.trim()||e.title.length>150||typeof e.instructions!=='string'||!e.instructions.trim()||e.instructions.length>2000||!Number.isInteger(e.minutes)||e.minutes<5||e.minutes>30)throw Error('Ongeldige oefening.');
 state.aiFeedback||={};state.aiFeedback[i]={schema:f.schema,week:f.week,summary:f.summary,focus:f.focus,exercises:f.exercises.map(x=>({title:x.title,minutes:x.minutes,instructions:x.instructions})),nextStep:f.nextStep,importedAt:new Date().toISOString()};save();alert('Feedback bewaard! Je aangepaste oefeningen staan bij de weekevaluatie.');page='reviewResult';renderResult(i)
 }catch(e){alert('Feedback kon niet worden geïmporteerd: '+e.message)}
}
function copyReview(i){let r=state.weekReviews[i],s=`Guitar Academy week ${i+1} (${weeks[i].title})\nTheorie: ${r.autoScore??'niet automatisch beoordeeld'}/3\nPraktijk: ${r.practical}/5\n16de-notentempo: ${r.bpm} BPM\nMoeilijkheden: ${r.difficulty||'geen'}\n`+(r.autoScore!==undefined?tests[i].map((t,j)=>`${t.q}: ${t.a[r.answers[j]]} (${r.answers[j]===t.correct?'goed':'fout'})`).join('\n'):'')+'\nGeef mij gerichte feedback en pas mijn volgende gitaarlessen aan.';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>alert('Gekopieerd! Plak dit in onze ChatGPT-chat.'),()=>prompt('Kopieer:',s))}else prompt('Kopieer:',s)}
let metBpm=80,metBeats=4,metAccent=true,metOn=false,metAudio=null,metNext=0,metIndex=0,metScheduler=null,metTap=[];
function metronome(){return `<section><h2>♩ Metronoom</h2><p class="muted">Voor ritme, alternate picking en je 16de-notenoefeningen. Start met 60–80 BPM en verhoog pas bij ontspannen controle.</p><div class="metbig" id="metBpm">${metBpm} <small>BPM</small></div><div class="row" style="justify-content:center"><button class="secondary" onclick="changeBpm(-5)">−5</button><button class="secondary" onclick="changeBpm(-1)">−1</button><button class="secondary" onclick="tapBpm()">Tap tempo</button><button class="secondary" onclick="changeBpm(1)">+1</button><button class="secondary" onclick="changeBpm(5)">+5</button></div><div style="text-align:center" id="metDots"></div><div class="metcontrols"><label>Maatsoort<select id="metBeats" onchange="metBeats=Number(this.value);restartMetro()">${[2,3,4,6].map(n=>`<option value="${n}" ${n===metBeats?'selected':''}>${n}/4</option>`).join('')}</select></label><label>Accent op eerste tel<select id="metAccent" onchange="metAccent=this.value==='yes'"><option value="yes" ${metAccent?'selected':''}>Aan</option><option value="no" ${!metAccent?'selected':''}>Uit</option></select></label></div><button id="metToggle" style="width:100%;font-size:19px" onclick="toggleMetro()">${metOn?'■ Stop':'▶ Start metronoom'}</button><p class="muted">Geluid werkt na een tik op Start. Houd het scherm actief voor de meest betrouwbare timing; dit is een browsermetronoom.</p></section>`}
function updateBeatDisplay(){let d=document.getElementById('metDots');if(d)d.innerHTML=Array.from({length:metBeats},(_,i)=>`<span class="metbeat ${i===0?'first':''}" id="beat${i}">${i+1}</span>`).join('');let b=document.getElementById('metBpm');if(b)b.innerHTML=metBpm+' <small>BPM</small>';let t=document.getElementById('metToggle');if(t)t.textContent=metOn?'■ Stop':'▶ Start metronoom'}
function changeBpm(n){metBpm=Math.min(240,Math.max(30,metBpm+n));updateBeatDisplay();if(metOn)restartMetro()}
function tapBpm(){let now=performance.now();metTap=metTap.filter(t=>now-t<2500);metTap.push(now);if(metTap.length>1){let gaps=metTap.slice(1).map((t,i)=>t-metTap[i]);metBpm=Math.min(240,Math.max(30,Math.round(60000/(gaps.reduce((a,b)=>a+b,0)/gaps.length))));updateBeatDisplay();if(metOn)restartMetro()}}
function playClick(time,accent){let osc=metAudio.createOscillator(),gain=metAudio.createGain();osc.type='sine';osc.frequency.setValueAtTime(accent?1200:850,time);gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.25,time+.002);gain.gain.exponentialRampToValueAtTime(.0001,time+.045);osc.connect(gain);gain.connect(metAudio.destination);osc.start(time);osc.stop(time+.05)}
function scheduleMetro(){if(!metOn||!metAudio)return;while(metNext<metAudio.currentTime+.12){let idx=metIndex,time=metNext;playClick(time,metAccent&&idx===0);let delay=Math.max(0,(time-metAudio.currentTime)*1000);setTimeout(()=>{if(!metOn||page!=='metronome')return;document.querySelectorAll('.metbeat').forEach(e=>e.classList.remove('hit'));document.getElementById('beat'+idx)?.classList.add('hit')},delay);metNext+=60/metBpm;metIndex=(metIndex+1)%metBeats}}
async function toggleMetro(){if(metOn){stopMetro();return}try{metAudio||=new (window.AudioContext||window.webkitAudioContext)();await metAudio.resume();metOn=true;metIndex=0;metNext=metAudio.currentTime+.05;metScheduler=setInterval(scheduleMetro,25);scheduleMetro();updateBeatDisplay()}catch(e){alert('Audio kon niet starten: '+e.message)}}
function stopMetro(){metOn=false;if(metScheduler){clearInterval(metScheduler);metScheduler=null}updateBeatDisplay()}
function restartMetro(){if(metOn){metIndex=0;metNext=metAudio.currentTime+.05}updateBeatDisplay()}
function backup(){return `<section><h2>Back-up en overdracht</h2><p>Je geïmporteerde ChatGPT-feedback wordt meegenomen in de JSON-back-up. Exporteer regelmatig, vooral voordat je van apparaat wisselt.</p><p>Je gegevens staan alleen in de browser van dit apparaat. Voor iPhone én Windows moet je een back-up exporteren en op het andere apparaat importeren. Private browsing en het wissen van websitegegevens kunnen je voortgang verwijderen.</p><div class="row"><button onclick="exportData()">Download back-up (.json)</button><label class="btn">Importeer back-up<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label></div><h3>Gratis installeren</h3><p>Publiceer deze map op een gratis statische host met HTTPS, bijvoorbeeld GitHub Pages. Open de website op iPhone in Safari → Deel → Zet op beginscherm. Op Windows kun je hem openen in Edge of Chrome en als app installeren.</p><p class="notice">Een gratis statische website synchroniseert je voortgang niet automatisch tussen apparaten. Voor echte synchronisatie is een extra cloudoplossing nodig.</p></section>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'guitar-academy',version:1,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='guitar-academy-backup.json';a.click();URL.revokeObjectURL(url)}async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(d.app!=='guitar-academy'||d.version!==1||!d.state||typeof d.state!=='object')throw Error('Ongeldig bestand');if(!confirm('Huidige voortgang vervangen door de back-up?'))return;state=d.state;state.done||={};state.notes||={};state.quiz||={};state.bpm||={};state.weekReviews||={};state.aiFeedback||={};state.minutes||=0;save();render();alert('Back-up geïmporteerd')}catch(e){alert('Importeren mislukt: '+e.message)}}render();
</script></body></html>
