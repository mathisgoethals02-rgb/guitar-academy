<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17212b"><title>Guitar Academy</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f5;background:#101820}*{box-sizing:border-box}body{margin:0}header{padding:20px max(18px,calc((100vw - 1000px)/2));background:#17212b;border-bottom:1px solid #33404a;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}h2{font-size:21px}h3{margin:10px 0}small,.muted{color:#a9b8c5}main{max-width:1000px;margin:auto;padding:18px;display:grid;grid-template-columns:240px 1fr;gap:20px}aside,section,.panel{background:#1a2631;border:1px solid #334350;border-radius:15px;padding:18px}aside{height:max-content}button,.btn{background:#3b8bd4;color:white;border:0;border-radius:9px;padding:11px 13px;font-weight:650;cursor:pointer}button.secondary{background:#2c3e4d}button:disabled{opacity:.4;cursor:not-allowed}nav button{display:block;width:100%;text-align:left;margin:8px 0;background:#273746}nav button.active{background:#326da1}article{line-height:1.6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#253644;padding:13px;border-radius:10px}.metric strong{font-size:24px;display:block}progress{width:100%;height:14px;accent-color:#59b68e}.lesson{border:1px solid #405364;border-radius:12px;padding:14px;margin:10px 0}.lesson.done{border-color:#438c70}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tag{font-size:12px;background:#314454;border-radius:50px;padding:5px 9px}ol li{margin-bottom:10px}textarea,input,select{background:#101a22;color:#fff;border:1px solid #566979;border-radius:8px;padding:10px;width:100%;font:inherit}label{display:block;margin:10px 0}.timer{font-variant-numeric:tabular-nums;font-size:42px;font-weight:750;text-align:center;margin:10px}pre{overflow:auto;background:#101820;padding:13px;border-radius:8px;line-height:1.3}.fret{overflow:auto}.fret table{border-collapse:collapse;min-width:550px;width:100%}.fret td,.fret th{text-align:center;border:1px solid #43515e;padding:9px 4px;font-size:12px}.fret .on{background:#347a9c;color:#fff;font-weight:700}.notice{background:#283a48;border-left:3px solid #5ca5de;padding:12px;border-radius:6px}a{color:#8bc7ff}.hide{display:none}@media(max-width:680px){main{display:block;padding:12px}aside{margin-bottom:12px}nav{display:flex;overflow:auto;gap:8px}nav button{white-space:nowrap;width:auto}header{padding:15px}.cards{grid-template-columns:repeat(3,1fr)}.metric{padding:9px}.metric strong{font-size:19px}}
</style></head><body><header><div><h1>🎸 Guitar Academy</h1><small>Persoonlijk gitaartraject · maand 1</small></div><span class="tag">Gratis · offline</span></header><main><aside><nav id="nav"></nav><hr style="border-color:#334350"><small>Voortgang wordt op dit apparaat bewaard. Exporteer geregeld een back-up om je gegevens over te zetten.</small></aside><div id="view"></div></main><script>
const weeks=[
{title:'Fretboard & intervallen',goal:'Vind C, F en G vlot en speel grondtoon, terts en kwint.',sessions:[
['Fretboard en grondtonen',[['5 min','Chromatische warming-up 1–2–3–4, 70 BPM, vier noten per tel.'],['10 min','Vind C, F en G op E-, A- en D-snaar (fret 0–12). Zeg elke noot hardop.'],['10 min','Vanaf C (A-snaar fret 3): vind E en G. Herhaal vanaf F en G.'],['5 min','Loop C–Am–F–G (70 BPM); speel alleen de grondtoon van ieder akkoord.']]],
['Intervallen worden akkoorden',[['5 min','Chromatische alternate picking; houd je handen ontspannen.'],['10 min','Speel C–E–G en C–E♭–G; hoor majeur versus mineur.'],['10 min','Zoek A–C–E (Am) en F–A–C (F) op verschillende snaren.'],['5 min','Improviseer uitsluitend met de actuele akkoordnoten over C–Am–F–G.']]],
['Toepassen en techniek',[['5 min','Alternate picking 16den bij 60 BPM; verhoog alleen bij zuivere timing.'],['10 min','Benoem en speel 1–3–5 van C, F, G en 1–♭3–5 van Am.'],['10 min','Loop: land bij elke akkoordwissel op een akkoordnoot.'],['5 min','Neem een korte improvisatie op en luister naar je akkoordwisselingen.']]]],
quiz:[['Welke noten vormen C majeur?','C E G'],['Wat verandert van C majeur naar C mineur?','E wordt Es (kleine terts)'],['Welke noten vormen Am?','A C E']]},
{title:'Drieklanken & CAGED',goal:'Speel C majeur op drie plekken en vind andere drieklanken zonder open grepen.',sessions:[
['C majeur in drie liggingen',[['5 min','Alternate-picking warming-up.'],['10 min','Leer C op G-B-e: 5-5-3, 9-8-8 en 12-13-12.'],['10 min','Speel de drie vormen op en neer en benoem de noten.'],['5 min','Maak een ritme met drie verschillende C-voicings.']]],
['Van majeur naar mineur',[['5 min','Herhaal de drie C-voicings.'],['10 min','Verlaag in iedere C-vorm de terts E naar Es.'],['10 min','Zoek drie Am-voicings op G-B-e (bijv. 5-5-5, 9-10-8, 14-13-12).'],['5 min','Wissel tussen C en Am met kleine handbewegingen.']]],
['Voice leading',[['5 min','16den alternate picking, 60–70 BPM.'],['10 min','Zoek nabije drieklanken van C–Am–F–G op G-B-e.'],['10 min','Speel de progressie met gedempte funk-aanslagen en een drumloop.'],['5 min','Neem de begeleiding op; controleer vloeiende wisselingen.']]]],
quiz:[['Wat is de formule van een majeurdrieklank?','1 3 5'],['Wat is de formule van een mineurdrieklank?','1 b3 5'],['Wat betekent een omkering?','Een andere akkoordnoot ligt in de bas']]},
{title:'Majeurtoonladder',goal:'Breid A mineur pentatonisch uit met F en B; speel C majeur bewust.',sessions:[
['C majeur leren',[['5 min','Alternate picking warming-up.'],['10 min','Leer de majeurformule 1–2–3–4–5–6–7 en C D E F G A B.'],['10 min','Speel de C-majeurpositie (tab onderaan) en zeg noten hardop.'],['5 min','Improviseer over C–Am–F–G met C majeur.']]],
['Uit de pentatonische box',[['5 min','Speel A mineur pentatonisch in 5e positie.'],['10 min','Voeg F en B toe aan je vertrouwde pentatonische frases.'],['10 min','Wissel bewust vijf- en zevennotige frases over de loop.'],['5 min','Neem twee versies op en vergelijk.']]],
['Posities verbinden',[['5 min','Alternate picking, 70 BPM.'],['10 min','Speel C majeur in twee aangrenzende posities.'],['10 min','Improviseer langs de hals, niet alleen binnen één box.'],['5 min','Speel een melodie op gehoor na en benoem de noten.']]]],
quiz:[['Welke noten zitten in C majeur?','C D E F G A B'],['Welke twee noten voeg je toe aan A mineur pentatonisch voor A natuurlijk mineur?','F en B'],['Welke mineurtoonladder heeft dezelfde noten als C majeur?','A natuurlijk mineur']]},
{title:'Akkoordgericht improviseren',goal:'Laat solo’s de akkoordwisselingen volgen; combineer techniek en muzikaliteit.',sessions:[
['Target notes',[['5 min','Alternate picking warming-up.'],['10 min','Zoek de akkoordnoten van C–Am–F–G binnen je C-majeurpositie.'],['10 min','Start of eindig iedere maat op een akkoordnoot.'],['5 min','Luister terug: hoor je de harmonie in je solo?']]],
['Bends en snelheid',[['5 min','16den alternate picking bij gecontroleerd tempo.'],['10 min','Speel doelnoot, bend vanuit een lagere noot naar dezelfde toonhoogte; controleer met tuner.'],['10 min','Oefen vibrato, legato en korte snelle frases met metronoom.'],['5 min','Gebruik één technische frase muzikaal in een solo.']]],
['Maandopdracht',[['5 min','Warm-up en stem je gitaar.'],['10 min','Neem C–Am–F–G op met minstens twee voicings.'],['10 min','Neem een solo op met diatonische noten en duidelijke chord tones.'],['5 min','Luister terug, noteer één sterk punt en één verbeterpunt.']]]],
quiz:[['Welke noten vormen G majeur?','G B D'],['Welke noot is de grote terts van F?','A'],['Waarom mik je op akkoordnoten?','Ze laten de melodie de harmonie volgen']]}];
const tab=`C majeur — positie rond fret 7–10\ne|-----------------------7-8-|\nB|-------------------8-10----|\nG|--------------7-9-10-------|\nD|---------7-9-10------------|\nA|----7-8-10-----------------|\nE|-8-10----------------------|`;
const key='guitar-academy-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch(e){state={}};state.done||={};state.notes||={};state.quiz||={};state.bpm||={};state.minutes||=0;state.weekReviews||={};let page='home',currentWeek=0,currentSession=0,timer=1800,interval=null;
function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function count(){return Object.values(state.done).filter(Boolean).length}function nav(){document.getElementById('nav').innerHTML=[['home','Dashboard'],['lessons','Lessen'],['fretboard','Gitaarhals'],['review','Evaluaties'],['backup','Back-up']].map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}function go(p){page=p;render()}function render(){nav();let v=document.getElementById('view');if(page==='home')v.innerHTML=home();if(page==='lessons')v.innerHTML=lessons();if(page==='lesson')v.innerHTML=lesson();if(page==='fretboard')v.innerHTML=fretboard();if(page==='review')v.innerHTML=review();if(page==='backup')v.innerHTML=backup()}
function home(){let next=Array.from({length:12},(_,i)=>i).find(i=>!state.done[i])??11;return `<section><h2>Welkom terug 👋</h2><p class="muted">Jouw 4-wekenprogramma, met 3 lessen van 30 minuten per week.</p><div class="cards"><div class="metric"><strong>${count()}/12</strong><small>Lessen</small></div><div class="metric"><strong>${state.minutes}</strong><small>Minuten</small></div><div class="metric"><strong>${Object.keys(state.weekReviews).length}/4</strong><small>Evaluaties</small></div></div><p><progress value="${count()}" max="12"></progress></p><div class="panel"><small>VOLGENDE LES · WEEK ${Math.floor(next/3)+1}</small><h3>${esc(weeks[Math.floor(next/3)].sessions[next%3][0])}</h3><p>${esc(weeks[Math.floor(next/3)].goal)}</p><button onclick="openLesson(${Math.floor(next/3)},${next%3})">Open les</button></div><h3>Vier weken</h3>${weeks.map((w,i)=>`<div class="lesson"><div class="row"><strong>Week ${i+1}: ${esc(w.title)}</strong><span class="tag">${[0,1,2].filter(j=>state.done[i*3+j]).length}/3</span></div><p class="muted">${esc(w.goal)}</p><button class="secondary" onclick="currentWeek=${i};go('lessons')">Bekijk lessen</button></div>`).join('')}</section>`}
function lessons(){return `<section><h2>Alle lessen</h2><div class="row">${weeks.map((w,i)=>`<button class="${i===currentWeek?'':'secondary'}" onclick="currentWeek=${i};render()">Week ${i+1}</button>`).join('')}</div><h3>${esc(weeks[currentWeek].title)}</h3><p>${esc(weeks[currentWeek].goal)}</p>${weeks[currentWeek].sessions.map((s,i)=>`<div class="lesson ${state.done[currentWeek*3+i]?'done':''}"><div class="row"><div><strong>Les ${currentWeek*3+i+1}: ${esc(s[0])}</strong><div class="muted">30 minuten</div></div><span>${state.done[currentWeek*3+i]?'✓ Voltooid':'Open'}</span></div><p><button onclick="openLesson(${currentWeek},${i})">${state.done[currentWeek*3+i]?'Opnieuw bekijken':'Start les'}</button></p></div>`).join('')}<button class="secondary" onclick="go('review')">Weekevaluatie</button></section>`}
function openLesson(w,s){currentWeek=w;currentSession=s;timer=1800;stopTimer();page='lesson';render()}
function lesson(){let w=weeks[currentWeek],s=w.sessions[currentSession],id=currentWeek*3+currentSession;return `<section><button class="secondary" onclick="go('lessons')">← Terug</button><p class="muted">WEEK ${currentWeek+1} · LES ${id+1}</p><h2>${esc(s[0])}</h2><div class="timer" id="clock">30:00</div><div class="row"><button onclick="startTimer()">▶ Start / hervat</button><button class="secondary" onclick="stopTimer()">Pauze</button><button class="secondary" onclick="resetTimer()">Reset</button></div><h3>Oefenplan</h3><ol>${s[1].map(x=>`<li><strong>${esc(x[0])}:</strong> ${esc(x[1])}</li>`).join('')}</ol><div class="notice">Loop: C – Am – F – G, één akkoord per maat op 70 BPM. Speel schoon en gecontroleerd; verhoog tempo alleen bij goede timing.</div>${currentWeek===1?'<h3>C-majeurdrieklanken op G–B–e</h3><pre>e|--3--|--8--|--12--|\nB|--5--|--8--|--13--|\nG|--5--|--9--|--12--|</pre>':''}${currentWeek===2?`<h3>C-majeurtoonladder</h3><pre>${tab}</pre>`:''}<h3>Jouw notities</h3><textarea id="notes" rows="4" placeholder="Wat ging goed? Waar liep je vast?">${esc(state.notes[id]||'')}</textarea><div class="row"><button class="secondary" onclick="state.notes[${id}]=document.getElementById('notes').value;save();alert('Notities opgeslagen')">Bewaar notities</button><button onclick="finishLesson(${id})">${state.done[id]?'✓ Al voltooid':'Markeer als voltooid'}</button></div></section>`}
function finishLesson(id){state.notes[id]=document.getElementById('notes').value;if(!state.done[id]){state.done[id]=true;state.minutes+=30}save();go('lessons')}
function startTimer(){if(interval)return;interval=setInterval(()=>{timer=Math.max(0,timer-1);let el=document.getElementById('clock');if(el)el.textContent=`${String(Math.floor(timer/60)).padStart(2,'0')}:${String(timer%60).padStart(2,'0')}`;if(timer===0){stopTimer();alert('30 minuten voorbij!')}},1000)}function stopTimer(){if(interval){clearInterval(interval);interval=null}}function resetTimer(){stopTimer();timer=1800;let el=document.getElementById('clock');if(el)el.textContent='30:00'}
const strings=[['e',4],['B',11],['G',7],['D',2],['A',9],['E',4]],names=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];let root=0,mode='major';function fretboard(){let pcs=mode==='major'?[0,2,4,5,7,9,11]:mode==='minor'?[0,2,3,5,7,8,10]:mode==='pent'?[0,3,5,7,10]:[0,4,7];let table='<table><tr><th>Snaar</th>'+Array.from({length:13},(_,i)=>`<th>${i}</th>`).join('')+'</tr>';for(let [label,pc] of strings){table+=`<tr><th>${label}</th>`+Array.from({length:13},(_,f)=>{let note=(pc+f)%12,delta=(note-root+12)%12;return `<td class="${pcs.includes(delta)?'on':''}">${pcs.includes(delta)?names[note]:'·'}</td>`}).join('')+'</tr>'}return `<section><h2>Interactieve gitaarhals</h2><p>Bekijk de noten van een toonladder of majeurdrieklank over fret 0–12.</p><div class="row"><label>Grondtoon<select onchange="root=Number(this.value);render()">${names.map((n,i)=>`<option value="${i}" ${i===root?'selected':''}>${n}</option>`).join('')}</select></label><label>Weergave<select onchange="mode=this.value;render()"><option value="major" ${mode==='major'?'selected':''}>Majeur</option><option value="minor" ${mode==='minor'?'selected':''}>Natuurlijk mineur</option><option value="pent" ${mode==='pent'?'selected':''}>Mineur pentatonisch</option><option value="triad" ${mode==='triad'?'selected':''}>Majeurdrieklank</option></select></label></div><div class="fret">${table+'</table>'}</div><p class="muted">Blauwe vakken zijn toonladder- of akkoordnoten. De hoge e-snaar staat bovenaan.</p></section>`}
function review(){return `<section><h2>Wekelijkse evaluaties</h2><p>Doe een korte kennistest en beoordeel je spel. De app adviseert herhaling als je score onder 70% ligt. Voor persoonlijke feedback kun je je evaluatie naar ChatGPT kopiëren.</p>${weeks.map((w,i)=>`<div class="lesson"><div class="row"><strong>Week ${i+1}: ${esc(w.title)}</strong><span class="tag">${state.weekReviews[i]?'Beoordeeld':'Nog niet beoordeeld'}</span></div><button class="secondary" onclick="openReview(${i})">${state.weekReviews[i]?'Opnieuw evalueren':'Start evaluatie'}</button></div>`).join('')}</section>`}
function openReview(i){currentWeek=i;page='reviewForm';nav();document.getElementById('view').innerHTML=`<section><button class="secondary" onclick="go('review')">← Terug</button><h2>Evaluatie week ${i+1}</h2><p class="muted">Beantwoord de kennisvragen en beoordeel je praktische uitvoering eerlijk.</p>${weeks[i].quiz.map((q,j)=>`<label><strong>${j+1}. ${esc(q[0])}</strong><input id="answer${j}" placeholder="Jouw antwoord"></label>`).join('')}<label>Praktische beheersing (0–5)<select id="practical">${Array.from({length:6},(_,j)=>`<option value="${j}">${j} / 5</option>`).join('')}</select></label><label>Wat ging moeilijk?<textarea id="difficulty" rows="3"></textarea></label><label>Comfortabel tempo voor 16de noten (BPM)<input id="bpm" type="number" min="30" max="240" value="${state.bpm[i]||70}"></label><button onclick="submitReview(${i})">Bewaar evaluatie en advies</button><p class="muted">Open antwoorden worden niet automatisch betrouwbaar nagekeken. Vergelijk zelf met de modelantwoorden na het indienen.</p></section>`}
function submitReview(i){let answers=weeks[i].quiz.map((q,j)=>document.getElementById('answer'+j).value),practical=Number(document.getElementById('practical').value),difficulty=document.getElementById('difficulty').value,bpm=Number(document.getElementById('bpm').value);state.weekReviews[i]={answers,practical,difficulty,bpm,date:new Date().toISOString()};state.bpm[i]=bpm;save();page='reviewResult';renderResult(i)}function renderResult(i){nav();let r=state.weekReviews[i],w=weeks[i];document.getElementById('view').innerHTML=`<section><h2>Evaluatie week ${i+1}</h2><p>Vergelijk je antwoorden met de modelantwoorden:</p>${w.quiz.map((q,j)=>`<div class="lesson"><strong>${esc(q[0])}</strong><p>Jij: ${esc(r.answers[j]||'—')}</p><p>Modelantwoord: <strong>${esc(q[1])}</strong></p></div>`).join('')}<div class="notice"><strong>Oefenadvies:</strong> ${r.practical<4?'Herhaal eerst de lastigste sessie van deze week. Je praktische score is nog onder 4/5.':'Je praktische score is goed. Ga verder als je de modelantwoorden ook begrijpt.'}</div><p><button onclick="copyReview(${i})">Kopieer evaluatie voor ChatGPT</button> <button class="secondary" onclick="go('review')">Terug</button></p></section>`}function copyReview(i){let r=state.weekReviews[i],w=weeks[i],s=`Gitaar Academy evaluatie week ${i+1} (${w.title})\n`+w.quiz.map((q,j)=>`${q[0]}\nMijn antwoord: ${r.answers[j]}\nModelantwoord: ${q[1]}`).join('\n')+`\nPraktische score: ${r.practical}/5\nTempo: ${r.bpm} BPM\nMoeilijkheden: ${r.difficulty}\nGeef feedback en pas mijn volgende oefenweek aan.`;navigator.clipboard?.writeText(s).then(()=>alert('Gekopieerd! Plak dit in je ChatGPT-chat.'),()=>prompt('Kopieer de tekst:',s))||prompt('Kopieer de tekst:',s)}
function backup(){return `<section><h2>Back-up en overdracht</h2><p>Je gegevens staan alleen in de browser van dit apparaat. Voor iPhone én Windows moet je een back-up exporteren en op het andere apparaat importeren. Private browsing en het wissen van websitegegevens kunnen je voortgang verwijderen.</p><div class="row"><button onclick="exportData()">Download back-up (.json)</button><label class="btn">Importeer back-up<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label></div><h3>Gratis installeren</h3><p>Publiceer deze map op een gratis statische host met HTTPS, bijvoorbeeld GitHub Pages. Open de website op iPhone in Safari → Deel → Zet op beginscherm. Op Windows kun je hem openen in Edge of Chrome en als app installeren.</p><p class="notice">Een gratis statische website synchroniseert je voortgang niet automatisch tussen apparaten. Voor echte synchronisatie is een extra cloudoplossing nodig.</p></section>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'guitar-academy',version:1,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='guitar-academy-backup.json';a.click();URL.revokeObjectURL(url)}async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(d.app!=='guitar-academy'||d.version!==1||!d.state||typeof d.state!=='object')throw Error('Ongeldig bestand');if(!confirm('Huidige voortgang vervangen door de back-up?'))return;state=d.state;state.done||={};state.notes||={};state.quiz||={};state.bpm||={};state.weekReviews||={};state.minutes||=0;save();render();alert('Back-up geïmporteerd')}catch(e){alert('Importeren mislukt: '+e.message)}}render();
</script></body></html>
